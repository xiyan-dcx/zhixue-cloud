server:
  port: 8080
spring:
  application:
    name: zhixue-cloud
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/zhixue?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: change-me
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
springdoc:
  swagger-ui:
    path: /swagger-ui.html
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true             # 下划线字段→驼峰属性
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl   # 控制台打印 SQL
  global-config:
    db-config:
      id-type: auto                                # 主键自增
      logic-delete-field: deleted                  # 逻辑删除字段名
      logic-delete-value: 1                        # 删除后的值
      logic-not-delete-value: 0                    # 未删除的值
zhixue:
  jwt:
    secret: replace-with-your-own-random-secret-at-least-32-bytes
    expire: 7200    # 令牌有效期（秒）
  upload:
    path: ./uploads     # 上传文件存放目录（相对项目根）
